[project]
name = "rlvr-grpo-experiments"
version = "0.1.0"
description = "Shared RLVR/GRPO testbed"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers>=4.51.0",
    "accelerate",
    "datasets",
    "numpy",
    "scipy",
    "pandas",
    "pyyaml",
    "tqdm",
    "safetensors",
    "sentencepiece",
    "protobuf",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlvr"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
