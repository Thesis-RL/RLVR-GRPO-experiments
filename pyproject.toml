[project]
name = "rlvr-grpo-experiments"
version = "0.1.0"
description = "Shared RLVR/GRPO testbed"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers>=4.51.0",
    "accelerate",
    "datasets",
    "numpy",
    "scipy",
    "pandas",
    "pyyaml",
    "tqdm",
    "safetensors",
    "sentencepiece",
    "protobuf",
]

[project.optional-dependencies]
dev = ["pytest"]
train = [
    "peft>=0.21.2",
    "trl>=1.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlvr"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["outputs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
