# Shared settings for both thesis studies. Study files extend this base and
# define only their condition matrix.
schema_version: 1

experiment:
  name: shared_rlvr
  study: shared

model:
  id: Qwen/Qwen3-1.7B-Base
  role: main_candidate
  revision: ea980cb0a6c2ae4b936e82123acc929f1cec04c1
  dtype: bfloat16

data:
  dataset: mbpp
  train_split: train
  validation_split: validation
  test_split: test
  few_shot_task_ids: [2, 3, 4]
  train_difficulty_path: outputs/offline_diagnostic/Qwen__Qwen3-1.7B-Base/difficulty.json
  # Generated once from the frozen initial checkpoint; required for main runs.
  test_difficulty_path: outputs/offline_diagnostic/Qwen__Qwen3-1.7B-Base/test/difficulty.json

generation:
  group_size: 16
  train_temperature: 1.0
  eval_temperature: 0.7
  top_p: 0.95
  max_new_tokens: 512
  stop_sequence: "[DONE]"

training:
  algorithm: grpo
  seeds: [0, 1, 2]
  protocol_status: frozen
  precision: bfloat16
  optimizer: adamw_torch
  lr_scheduler_type: linear
  warmup_steps: 0
  weight_decay: 0.0
  max_grad_norm: 1.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  gradient_checkpointing: true
  use_vllm: false
  scale_rewards: group
  loss_type: dapo
  num_iterations: 1
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules: [q_proj, v_proj]
  smoke:
    group_size: 16
    learning_rate: 1.0e-6
    per_device_train_batch_size: 1
    # One optimizer step consumes the same full group used by the main protocol.
    gradient_accumulation_steps: 16
    max_steps: 2
    kl_coefficient: 0.0
    logging_steps: 1
    save_steps: 1
    save_total_limit: 2
  # One optimizer step consumes one 16-completion group. 374 steps are one
  # fixed pass over the complete MBPP training split.
  main:
    learning_rate: 1.0e-6
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 16
    max_steps: 374
    kl_coefficient: 0.0
    logging_steps: 1
    # Scheduled clean evaluations force exact 10%-interval checkpoints.
    save_steps: 374
    save_total_limit: 10

evaluation:
  clean_only: true
  primary_metric: pass_at_1
  primary_metric_last_n: 2
  validation_interval_fraction: 0.1
  test_fractions: [0.9, 1.0]
  seed: 0
  timeout_s: 0.5
  mem_mb: 64

logging:
  output_root: outputs
  save_rollouts: true
  save_clean_outcomes: true
  save_noisy_outcomes: true
  save_both_rewards: true
  save_advantages: true
