extends: priority_bridge.yaml

experiment:
  name: stage5_clean_pilot
  study: clean_training_pilot

training:
  seeds: [9001]
  protocol_status: pilot
  smoke:
    group_size: 16
    learning_rate: 2.0e-6
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 16
    max_steps: 2
    kl_coefficient: 0.0
    logging_steps: 1
    save_steps: 1
    save_total_limit: 2
    warmup_steps: 0
    lr_scheduler_type: linear
  pilot:
    group_size: 16
    learning_rate: 2.0e-6
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 16
    max_steps: 1122
    kl_coefficient: 0.0
    logging_steps: 1
    save_steps: 112
    save_total_limit: 12
    warmup_steps: 56
    lr_scheduler_type: linear

# Protocol selection is validation-only. The held-out test set is not touched
# until the selected training protocol has been frozen.
evaluation:
  primary_metric_last_n: 0
  validation_interval_fraction: 0.1
  validation_step0: true
  test_fractions: []

# Frozen before the full pilot starts. The analyzer uses only the 90-task
# validation split and the matched step-0 evaluation generated by the runner.
pilot_selection_gate:
  status: preregistered
  primary_split: validation
  baseline_step: 0
  late_checkpoint_count: 3
  min_late_mean_delta_pass_at_1: 0.03
  min_late_checkpoints_above_baseline: 2
  min_late_mean_delta_mean_test_pass_rate: 0.0
  max_allowed_non_degradation_pass_at_1: 0.01
  max_allowed_non_degradation_mean_test_pass_rate: 0.01
  bootstrap_replicates: 10000
  bootstrap_seed: 9001
  overall_pass_rule: >-
    Both conditions must complete without technical errors, at least one must
    pass the improvement thresholds, and both must pass the non-degradation
    thresholds. Otherwise the six-condition matrix remains blocked for review.

matrix:
  reward_types: [binary, fractional]
  noise_specs:
    - name: clean
